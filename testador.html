<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | MoonMC</title>
    <link rel="stylesheet" href="style.css">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

    :root {
        --roxo: #a855f7;
        --roxo-claro: #d8b4fe;
        --roxo-escuro: #581c87;
        --fundo: #0a0414;
        --cartao: #1a0d2e;
        --linha: #2d1b4d;
        --texto: #e9e2f5;
        --cinza: #9a8fb5;
        --ouro: #ffd700;
        --prata: #c0c0c0;
        --bronze: #cd7f32;
        --glow: rgba(168,85,247,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Inter', system-ui, sans-serif;
        color: var(--texto);
        background: var(--fundo);
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* ===== FUNDO GRADIENT ===== */
    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background:
            radial-gradient(ellipse at 20% 50%, rgba(88,28,135,0.12) 0%, transparent 50%),
            radial-gradient(ellipse at 80% 20%, rgba(168,85,247,0.08) 0%, transparent 50%),
            radial-gradient(ellipse at 50% 80%, rgba(139,92,246,0.06) 0%, transparent 50%);
        z-index: -1;
    }

    .navbar-spacer { height: 60px; }

    header {
        text-align: center;
        padding: 40px 20px 30px;
        position: relative;
        animation: fadeDown 0.6s ease-out;
    }
    header::after {
        content: '';
        position: absolute;
        bottom: 0; left: 50%;
        transform: translateX(-50%);
        width: 200px; height: 2px;
        background: linear-gradient(90deg, transparent, var(--roxo), transparent);
    }
    .logo {
        font-size: clamp(32px, 6vw, 56px);
        font-weight: 900;
        letter-spacing: 8px;
        background: linear-gradient(135deg, var(--roxo-claro), var(--roxo), #7c3aed, var(--roxo-claro));
        background-size: 300% 300%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 4s ease infinite;
        text-shadow: 0 0 40px var(--glow);
    }
    @keyframes shimmer {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
    }
    .sub {
        color: var(--cinza);
        font-size: 14px;
        letter-spacing: 5px;
        margin-top: 12px;
        text-transform: uppercase;
    }
    @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-16px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .tabs-wrap {
        padding: 20px;
        animation: fadeDown 0.6s ease-out 0.15s both;
    }
    .tabs-row {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 10px;
    }
    .tabs-row:last-child { margin-bottom: 0; }

    .tab {
        padding: 9px 26px;
        border: 1px solid var(--linha);
        border-radius: 8px;
        background: rgba(255,255,255,0.03);
        color: var(--cinza);
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.25s;
        font-family: inherit;
    }
    .tab:hover {
        color: #fff;
        border-color: rgba(168,85,247,0.4);
        background: rgba(168,85,247,0.08);
    }
    .tab.active {
        background: linear-gradient(135deg, var(--roxo), #7c3aed);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 2px 16px var(--glow);
    }

    #boards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 24px;
        padding: 20px 24px 60px;
        max-width: 1200px;
        margin: 0 auto;
    }

    .cartao {
        background: var(--cartao);
        border: 1px solid var(--linha);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3), 0 0 40px rgba(88,28,135,0.1);
        transition: transform 0.3s, box-shadow 0.3s;
        opacity: 0;
        transform: translateY(30px);
        animation: fadeUp 0.5s ease-out forwards;
    }
    .cartao:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 60px rgba(168,85,247,0.15);
    }
    .cartao:nth-child(1) { animation-delay: 0.1s; }
    .cartao:nth-child(2) { animation-delay: 0.2s; }
    .cartao:nth-child(3) { animation-delay: 0.3s; }
    .cartao:nth-child(4) { animation-delay: 0.4s; }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .cartao-header {
        padding: 14px 20px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--roxo-claro);
        background: linear-gradient(135deg, rgba(88,28,135,0.4), rgba(88,28,135,0.1));
        border-bottom: 1px solid var(--linha);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .cartao-header .board-name {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .cartao-header .board-emoji {
        font-size: 16px;
    }
    .cartao-header .tipo {
        font-size: 10px;
        font-weight: 400;
        color: var(--cinza);
        background: rgba(255,255,255,0.05);
        padding: 3px 10px;
        border-radius: 20px;
        letter-spacing: 0;
        text-transform: none;
    }

    table { width: 100%; border-collapse: collapse; }
    tr { transition: background 0.2s; }
    tr:hover { background: rgba(168,85,247,0.05); }
    td {
        padding: 12px 16px;
        font-size: 14px;
        border-top: 1px solid rgba(45,27,77,0.4);
    }
    tr:first-child td { border-top: none; }

    .pos {
        width: 40px;
        font-weight: 900;
        font-size: 16px;
        text-align: center;
    }
    .pos-1 { color: var(--ouro); text-shadow: 0 0 10px rgba(255,215,0,0.4); }
    .pos-2 { color: var(--prata); text-shadow: 0 0 10px rgba(192,192,192,0.3); }
    .pos-3 { color: var(--bronze); text-shadow: 0 0 10px rgba(205,127,50,0.3); }
    .pos-medalha { font-size: 20px; }

    .jogador {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .head {
        width: 32px; height: 32px;
        border-radius: 8px;
        image-rendering: pixelated;
        background: rgba(255,255,255,0.05);
        border: 2px solid rgba(168,85,247,0.2);
        transition: border-color 0.2s, transform 0.2s;
    }
    tr:hover .head {
        border-color: var(--roxo);
        transform: scale(1.1);
    }
    .nome {
        font-weight: 700;
        font-size: 14px;
        color: var(--texto);
    }
    .vazio-slot {
        color: rgba(154,143,181,0.3);
        font-style: italic;
        font-weight: 400;
    }

    /* ===== GROUP TAGS - Cores do LuckPerms ===== */
    .group-tag {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 4px;
        margin-left: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        vertical-align: middle;
        line-height: 1;
    }
    .group-tag.yt,
    .group-tag.gerente,
    .group-tag.admin,
    .group-tag.mod {
        background: linear-gradient(135deg, #7f1d1d, #991b1b);
        color: #f87171;
        border: 1px solid rgba(248,113,113,0.3);
        text-shadow: 0 0 8px rgba(248,113,113,0.3);
    }
    .group-tag.partner {
        background: linear-gradient(135deg, #831843, #9d174d);
        color: #f472b6;
        border: 1px solid rgba(244,114,182,0.3);
        text-shadow: 0 0 8px rgba(244,114,182,0.3);
    }
    .group-tag.twitch {
        background: linear-gradient(135deg, #701a75, #86198f);
        color: #e879f9;
        border: 1px solid rgba(232,121,249,0.3);
        text-shadow: 0 0 8px rgba(232,121,249,0.3);
    }
    .group-tag.creator {
        background: linear-gradient(135deg, #3b0764, #581c87);
        color: #a78bfa;
        border: 1px solid rgba(167,139,250,0.3);
        text-shadow: 0 0 8px rgba(167,139,250,0.3);
    }
    .group-tag.prime {
        background: linear-gradient(135deg, #164e63, #155e75);
        color: #22d3ee;
        border: 1px solid rgba(34,211,238,0.3);
        text-shadow: 0 0 8px rgba(34,211,238,0.3);
    }
    .group-tag.vip {
        background: linear-gradient(135deg, #14532d, #166534);
        color: #4ade80;
        border: 1px solid rgba(74,222,128,0.3);
        text-shadow: 0 0 8px rgba(74,222,128,0.3);
    }
    .group-tag.membro {
        background: #2a2a3a;
        color: #b0b0c0;
        border: 1px solid rgba(176,176,192,0.2);
        text-shadow: 0 0 4px rgba(176,176,192,0.15);
    }
    .group-tag.helper {
        background: linear-gradient(135deg, #164e63, #0e7490);
        color: #67e8f9;
        border: 1px solid rgba(103,232,249,0.3);
        text-shadow: 0 0 8px rgba(103,232,249,0.3);
    }
    .group-tag.default {
        background: linear-gradient(135deg, #1e1b4b, #312e81);
        color: #818cf8;
        border: 1px solid rgba(129,140,248,0.2);
        text-shadow: 0 0 8px rgba(129,140,248,0.2);
    }
    .group-tag.outro {
        background: linear-gradient(135deg, #1e1b4b, #312e81);
        color: #a5b4fc;
        border: 1px solid rgba(165,180,252,0.2);
    }

    .valor {
        text-align: right;
        font-weight: 800;
        font-size: 15px;
        color: var(--roxo-claro);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
    }

    #estado {
        text-align: center;
        color: var(--cinza);
        font-size: 13px;
        padding: 10px 20px 50px;
        letter-spacing: 0.5px;
    }

    .vazio {
        text-align: center;
        color: var(--cinza);
        padding: 60px 20px;
        font-size: 16px;
    }
    .spinner {
        display: inline-block;
        width: 30px; height: 30px;
        border: 3px solid var(--linha);
        border-top-color: var(--roxo);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
        #boards { grid-template-columns: 1fr; padding: 20px 12px 40px; gap: 16px; }
        .cartao-header { font-size: 12px; padding: 12px 14px; }
        td { padding: 10px 12px; font-size: 13px; }
        .head { width: 28px; height: 28px; }
        .tab { padding: 7px 16px; font-size: 12px; }
    }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="navbar-inner">
            <div class="navbar-left">
                <a href="index.html" class="navbar-brand">
                    <img src="assets/logo-moon.webp" alt="MoonMC" class="brand-logo">
                </a>
                <div class="navbar-menu">
                    <a href="index.html">Inicio</a>
                    <a href="sobre.html">Sobre</a>
                    <a href="testador.html" class="active">Leaderboard</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="navbar-spacer"></div>

    <header>
        <div class="logo">MOONMC</div>
        <div class="sub">Tops do Servidor</div>
    </header>

    <div class="tabs-wrap">
        <div class="tabs-row" id="period-row">
            <button class="tab active" onclick="selectPeriod(this, 'alltime')">All time</button>
            <button class="tab" onclick="selectPeriod(this, 'monthly')">Mensal</button>
            <button class="tab" onclick="selectPeriod(this, 'weekly')">Semanal</button>
        </div>
        <div class="tabs-row" id="category-row">
            <button class="tab active" onclick="selectCategory(this, 'statistic_player_kills')">Kills</button>
            <button class="tab" onclick="selectCategory(this, 'statistic_deaths')">Mortes</button>
            <button class="tab" onclick="selectCategory(this, 'vault_eco_balance')">Dinheiro</button>
            <button class="tab" onclick="selectCategory(this, 'statistic_time_played')">Tempo Online</button>
            <button class="tab" onclick="selectCategory(this, 'ypesca_fished')">Peixes</button>
        </div>
    </div>

    <div id="boards">
        <div class="vazio">
            <div class="spinner"></div>
            <div>A carregar tops...</div>
        </div>
    </div>

    <script>
    // ===== ESTRELAS CADENTES =====
    (function() {
        var container = document.body;
        var numStars = 40;

        for (var i = 0; i < numStars; i++) {
            criarEstrela(container);
        }

        setInterval(function() {
            if (document.querySelectorAll('.star').length < 50) {
                criarEstrela(container);
            }
        }, 1000);

        function criarEstrela(parent) {
            var star = document.createElement('div');
            star.className = 'star';
            star.style.cssText = 'position:fixed;pointer-events:none;z-index:0;';

            var startX = Math.random() * 100;
            var startY = -5 - Math.random() * 10;
            var tamanho = 1 + Math.random() * 2;
            var velocidade = 4 + Math.random() * 8;
            var delay = Math.random() * 3;

            var cores = ['#ffffff', '#d8b4fe', '#93c5fd', '#a5b4fc', '#c4b5fd'];
            var cor = cores[Math.floor(Math.random() * cores.length)];
            var brilho = 0.2 + Math.random() * 0.5;
            var angulo = -75 + Math.random() * 10;

            star.style.left = startX + '%';
            star.style.top = startY + '%';

            var dot = document.createElement('div');
            dot.style.cssText = 'position:absolute;width:' + tamanho + 'px;height:' + tamanho + 'px;background:' + cor + ';border-radius:50%;box-shadow:0 0 ' + (tamanho * 3) + 'px ' + cor + ';opacity:' + brilho + ';left:0;top:0;';

            var trailLen = 15 + Math.random() * 30;
            var trail = document.createElement('div');
            trail.style.cssText = 'position:absolute;width:1px;height:' + trailLen + 'px;background:linear-gradient(to bottom,' + cor + ',transparent);transform:rotate(' + angulo + 'deg);opacity:' + (brilho * 0.4) + ';left:0;top:0;transform-origin:top center;';

            star.appendChild(trail);
            star.appendChild(dot);
            parent.appendChild(star);

            var startTime = Date.now() + delay * 1000;
            var driftX = (Math.random() - 0.5) * 80;

            function animar() {
                var agora = Date.now();
                if (agora < startTime) { requestAnimationFrame(animar); return; }

                var elapsed = (agora - startTime) / 1000;
                var progress = elapsed / velocidade;

                if (progress >= 1) { star.remove(); return; }

                var y = startY + (120) * progress;
                var x = driftX * progress;

                star.style.transform = 'translate(' + x + 'px,' + (y) + 'vh)';

                if (progress > 0.7) {
                    star.style.opacity = 1 - ((progress - 0.7) / 0.3);
                }

                requestAnimationFrame(animar);
            }

            requestAnimationFrame(animar);
        }
    })();
    </script>

    <script>
    var MEDALHAS = { 1: '\uD83E\uDD47', 2: '\uD83E\uDD48', 3: '\uD83E\uDD49' };
    var API_URL = 'https://www.moonmc.com.br/api/tops/read';
    var activePeriod = 'alltime';
    var activeCategory = 'statistic_player_kills';
    var cachedData = null;

    var BOARD_INFO = {
        'statistic_player_kills': { label: 'Kills', emoji: '\u2694\uFE0F' },
        'statistic_deaths': { label: 'Mortes', emoji: '\uD83D\uDC80' },
        'statistic_mob_kills': { label: 'Mob Kills', emoji: '\uD83D\uDC32' },
        'statistic_time_played': { label: 'Tempo Online', emoji: '\u23F1\uFE0F' },
        'vault_eco_balance': { label: 'Dinheiro', emoji: '\uD83D\uDCB0' },
        'ypesca_fished': { label: 'Peixes', emoji: '\uD83C\uDFA3' }
    };

    var GROUP_CLASSES = {
        'yt': 'yt',
        'partner': 'partner',
        'twitch': 'twitch',
        'creator': 'creator',
        'prime': 'prime',
        'vip': 'vip',
        'gerente': 'gerente',
        'admin': 'admin',
        'mod': 'mod',
        'helper': 'helper',
        'membro': 'membro',
        'default': 'default',
        'memorial': 'default'
    };

    function getGroupClass(group) {
        if (!group || group === '---' || group === '') return '';
        var g = group.toLowerCase().trim();
        if (GROUP_CLASSES[g]) return GROUP_CLASSES[g];
        for (var key in GROUP_CLASSES) {
            if (g.indexOf(key) !== -1) return GROUP_CLASSES[key];
        }
        return 'outro';
    }

    function selectPeriod(el, period) {
        document.querySelectorAll('#period-row .tab').forEach(function(b) { b.classList.remove('active'); });
        el.classList.add('active');
        activePeriod = period;
        if (cachedData) renderizar(cachedData);
    }

    function selectCategory(el, cat) {
        document.querySelectorAll('#category-row .tab').forEach(function(b) { b.classList.remove('active'); });
        el.classList.add('active');
        activeCategory = cat;
        if (cachedData) renderizar(cachedData);
    }

    function esc(s) {
        return String(s).replace(/[&<>"']/g, function(c) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
    }

    function formatValue(val) {
        var s = String(val);
        if (/[a-zA-Z]/.test(s)) return esc(s);
        var n = parseFloat(s.replace(/,/g, ''));
        if (isNaN(n)) return esc(val);
        if (n >= 1000000) return esc((n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M');
        if (n >= 1000) return esc((n / 1000).toFixed(1).replace(/\.0$/, '') + 'K');
        if (s.indexOf('.') !== -1 || s.indexOf(',') !== -1) return esc(s);
        return esc(Math.round(n).toLocaleString('pt-BR'));
    }

    function carregar() {
        var el = document.getElementById('boards');

        fetch(API_URL + '?t=' + Date.now())
            .then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function(dados) {
                cachedData = dados;
                if (!dados.boards || dados.boards.length === 0) {
                    el.innerHTML = '<div class="vazio">Nenhum top encontrado ainda.<br><small>O plugin ainda nao enviou dados.</small></div>';
                    return;
                }
                renderizar(dados);
            })
            .catch(function(e) {
                el.innerHTML = '<div class="vazio">Erro ao carregar tops.<br><small>' + esc(e.message) + '</small></div>';
            });
    }

    function renderizar(dados) {
        var el = document.getElementById('boards');
        var boards = dados.boards.filter(function(b) {
            return b.board === activeCategory && b.type === activePeriod;
        });

        if (boards.length === 0) {
            el.innerHTML = '<div class="vazio">Nenhum top encontrado para este periodo.</div>';
            return;
        }

        var maxEntries = activePeriod === 'alltime' ? 100 : 10;

        var html = '';
        for (var i = 0; i < boards.length; i++) {
            var b = boards[i];
            var info = BOARD_INFO[b.board] || { label: b.board, emoji: '\uD83C\uDFC6' };
            var linhas = '';

            var entriesMap = {};
            if (b.entries) {
                for (var k = 0; k < b.entries.length; k++) {
                    entriesMap[b.entries[k].pos] = b.entries[k];
                }
            }

            for (var j = 1; j <= maxEntries; j++) {
                var e = entriesMap[j];
                if (e) {
                    var medalha = MEDALHAS[e.pos] || e.pos;
                    var classe = e.pos <= 3 ? 'pos pos-' + e.pos : 'pos';
                    var medalhaClasse = e.pos <= 3 ? 'pos-medalha' : '';
                    var head = '<img class="head" src="https://mc-heads.net/avatar/' + encodeURIComponent(e.name) + '/64" alt="" loading="lazy" onerror="this.src=\'https://mc-heads.net/avatar/steve/64\'">';
                    var groupHtml = '';
                    if (e.group && e.group !== '---' && e.group !== 'default' && e.group !== '') {
                        var gc = getGroupClass(e.group);
                        groupHtml = '<span class="group-tag ' + gc + '">' + esc(e.group.toUpperCase()) + '</span>';
                    }
                    linhas += '<tr><td class="' + classe + ' ' + medalhaClasse + '">' + medalha + '</td><td class="jogador">' + head + '<span class="nome">' + esc(e.name) + groupHtml + '</span></td><td class="valor">' + formatValue(e.value) + '</td></tr>';
                } else {
                    var medalhaVazia = MEDALHAS[j] || j;
                    var classeVazia = j <= 3 ? 'pos pos-' + j : 'pos';
                    var medalhaClasseVazia = j <= 3 ? 'pos-medalha' : '';
                    linhas += '<tr><td class="' + classeVazia + ' ' + medalhaClasseVazia + '">' + medalhaVazia + '</td><td class="jogador"><div class="head" style="opacity:0.2"></div><span class="nome vazio-slot">---</span></td><td class="valor vazio-slot">-</td></tr>';
                }
            }
            html += '<div class="cartao"><div class="cartao-header"><span class="board-name"><span class="board-emoji">' + info.emoji + '</span> ' + esc(info.label) + '</span><span class="tipo">' + esc(activePeriod) + '</span></div><table>' + linhas + '</table></div>';
        }
        el.innerHTML = html;
    }

    carregar();
    setInterval(carregar, 900000);
    </script>
</body>
