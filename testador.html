<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | MoonMC</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0d0a1a;
            min-height: 100vh;
        }

        .lb-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 24px 60px;
        }

        /* Header */
        .lb-header {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeDown 0.6s ease-out;
        }
        .lb-logo {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 0.06em;
            background: linear-gradient(135deg, #b48bfa 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
        }
        .lb-subtitle {
            color: #8b8ba3;
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-top: 6px;
        }
        .lb-divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #b48bfa, #6ee7b7);
            border-radius: 2px;
            margin: 14px auto 0;
        }

        /* Seletor por top */
        .lb-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 36px;
            animation: fadeDown 0.6s ease-out 0.15s both;
        }
        .lb-tab {
            padding: 9px 26px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            background: rgba(255,255,255,0.03);
            color: #6b6b8a;
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
        }
        .lb-tab:hover {
            color: #bbb;
            border-color: rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
        }
        .lb-tab.active {
            background: linear-gradient(135deg, #b48bfa, #818cf8);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 2px 16px rgba(180,139,250,0.35);
        }

        /* Grid */
        .lb-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 36px;
        }

        /* Card */
        .lb-card {
            background: linear-gradient(180deg, rgba(120,60,200,0.10) 0%, rgba(20,12,40,0.70) 100%);
            border: 1px solid rgba(160,100,255,0.15);
            border-radius: 14px;
            overflow: hidden;
            opacity: 0;
            transform: translateY(16px);
            animation: cardIn 0.45s ease-out forwards;
        }
        .lb-card:nth-child(1) { animation-delay: 0.1s; }
        .lb-card:nth-child(2) { animation-delay: 0.2s; }
        .lb-card:nth-child(3) { animation-delay: 0.3s; }
        .lb-card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lb-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 16px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(160,100,255,0.10);
        }
        .lb-card-name {
            font-size: 0.78rem;
            font-weight: 700;
            color: #c4a5f5;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .lb-card-badge {
            font-size: 0.6rem;
            font-weight: 600;
            color: #6b6b8a;
            background: rgba(255,255,255,0.05);
            padding: 3px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .lb-list {
            list-style: none;
            padding: 2px 0;
        }
        .lb-row {
            display: flex;
            align-items: center;
            padding: 7px 16px;
            gap: 10px;
            transition: background 0.15s;
        }
        .lb-row:hover {
            background: rgba(255,255,255,0.025);
        }

        .lb-rank {
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .lb-rank-num {
            font-weight: 700;
            font-size: 0.85rem;
            color: #555570;
        }
        .lb-rank-num.gold { color: #ffd700; }
        .lb-rank-num.silver { color: #b8b8c8; }
        .lb-rank-num.bronze { color: #cd7f32; }

        .lb-head {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            image-rendering: pixelated;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .lb-name {
            flex: 1;
            font-weight: 600;
            font-size: 0.85rem;
            color: #e0e0f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lb-val {
            font-weight: 700;
            font-size: 0.85rem;
            color: #fff;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .lb-empty {
            text-align: center;
            padding: 16px;
            color: #555570;
            font-size: 0.85rem;
        }

        /* Botao */
        .lb-update-btn {
            display: block;
            margin: 0 auto;
            padding: 10px 28px;
            background: linear-gradient(135deg, #b48bfa, #6ee7b7);
            color: #170b2b;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
        }
        .lb-update-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(180,139,250,0.4);
        }

        @media (max-width: 900px) {
            .lb-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .lb-grid { grid-template-columns: 1fr; }
            .lb-logo { font-size: 2.2rem; }
            .lb-page { padding-top: 80px; }
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="navbar-inner">
            <div class="navbar-left">
                <a href="index.html" class="navbar-brand">
                    <img src="assets/logo-moon.webp" alt="MoonMC" class="brand-logo">
                </a>
                <div class="navbar-menu">
                    <a href="index.html">Inicio</a>
                    <a href="sobre.html">Sobre</a>
                    <a href="testador.html" class="active">Leaderboard</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="lb-page">
        <div class="lb-header">
            <div class="lb-logo">MoonMC</div>
            <div class="lb-subtitle">Tops do Servidor</div>
            <div class="lb-divider"></div>
        </div>

        <div class="lb-tabs">
            <button class="lb-tab active" onclick="selectPeriod(this)">All time</button>
        </div>

        <div id="lb-grid" class="lb-grid"></div>

        <button class="lb-update-btn" onclick="refreshData()">Atualizar Dados</button>
    </div>

    <script>
        var API = 'https://www.moonmc.com.br/api/tops/read';
        var BOARDS = [
            { key: 'statistic_player_kills', label: 'Player Kills', icon: '\u2694\uFE0F' },
            { key: 'statistic_deaths', label: 'Deaths', icon: '\uD83D\uDC80' },
            { key: 'vault_eco_balance', label: 'Dinheiro', icon: '\uD83D\uDCB0' },
            { key: 'ypesca_fished', label: 'Peixes', icon: '\uD83C\uDFA3' }
        ];

        function selectPeriod(el) {
            document.querySelectorAll('.lb-tab').forEach(function(b) { b.classList.remove('active'); });
            el.classList.add('active');
        }

        function parseVal(v) {
            if (!v || v === '---') return 0;
            return parseFloat(String(v).replace(/,/g, '')) || 0;
        }
        function fmtMoney(v) {
            var n = parseVal(v);
            if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
            if (n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'') + 'K';
            return Math.round(n).toLocaleString('pt-BR');
        }
        function fmtNum(v) { return Math.round(parseVal(v)).toLocaleString('pt-BR'); }
        function fmtTime(v) { return (!v || v === '---') ? '0' : String(v); }
        function headUrl(n) { return 'https://mc-heads.net/avatar/' + encodeURIComponent(n) + '/36'; }

        function buildCard(boardData, info) {
            var card = document.createElement('div');
            card.className = 'lb-card';

            var hd = document.createElement('div');
            hd.className = 'lb-card-head';
            hd.innerHTML = '<span class="lb-card-name">' + info.icon + ' ' + info.label + '</span><span class="lb-card-badge">alltime</span>';
            card.appendChild(hd);

            var ul = document.createElement('ul');
            ul.className = 'lb-list';
            var n = 0;

            for (var i = 0; i < boardData.entries.length && n < 10; i++) {
                var e = boardData.entries[i];
                if (!e.name || e.name === '---' || e.value === '---') continue;

                var li = document.createElement('li');
                li.className = 'lb-row';

                var rk = document.createElement('div');
                rk.className = 'lb-rank';
                var rs = document.createElement('span');
                rs.className = 'lb-rank-num';
                if (n === 0) rs.className += ' gold';
                else if (n === 1) rs.className += ' silver';
                else if (n === 2) rs.className += ' bronze';
                rs.textContent = n + 1;
                rk.appendChild(rs);
                li.appendChild(rk);

                var img = document.createElement('img');
                img.className = 'lb-head';
                img.src = headUrl(e.name);
                img.alt = e.name;
                img.onerror = function() { this.src = 'https://mc-heads.net/avatar/steve/36'; };
                li.appendChild(img);

                var nm = document.createElement('span');
                nm.className = 'lb-name';
                nm.textContent = e.name;
                li.appendChild(nm);

                var vl = document.createElement('span');
                vl.className = 'lb-val';
                if (info.key === 'vault_eco_balance') vl.textContent = fmtMoney(e.value);
                else if (info.key === 'statistic_time_played') vl.textContent = fmtTime(e.value);
                else vl.textContent = fmtNum(e.value);
                li.appendChild(vl);

                ul.appendChild(li);
                n++;
            }

            if (n === 0) {
                var em = document.createElement('li');
                em.className = 'lb-row';
                em.innerHTML = '<span class="lb-empty" style="width:100%">Sem dados</span>';
                ul.appendChild(em);
            }

            card.appendChild(ul);
            return card;
        }

        function render(data) {
            var grid = document.getElementById('lb-grid');
            grid.innerHTML = '';
            if (!data || !data.boards || data.boards.length === 0) {
                grid.innerHTML = '<div class="lb-empty" style="grid-column:1/-1">Sem dados disponiveis</div>';
                return;
            }
            BOARDS.forEach(function(info) {
                var bd = data.boards.find(function(b) { return b.board === info.key; });
                if (bd) grid.appendChild(buildCard(bd, info));
            });
        }

        function refreshData() {
            var btn = document.querySelector('.lb-update-btn');
            btn.textContent = 'Atualizando...';
            btn.disabled = true;
            fetch(API).then(function(r) { return r.json(); }).then(function(d) {
                render(d);
                btn.textContent = 'Atualizar Dados';
                btn.disabled = false;
            }).catch(function() {
                btn.textContent = 'Atualizar Dados';
                btn.disabled = false;
            });
        }

        refreshData();
        setInterval(refreshData, 30000);
    </script>
</body>
</html>
