<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | MoonMC</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .leaderboard {
            max-width: 1200px;
            margin: 80px auto;
            padding: 0 24px;
        }
        .leaderboard-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .leaderboard-title {
            font-size: 2.5rem;
            margin-bottom: 12px;
            color: var(--neon);
            font-family: var(--font-display);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .leaderboard-subtitle {
            color: var(--gray);
            font-size: 1.1rem;
        }
        .board-section {
            margin-bottom: 48px;
        }
        .board-title {
            font-size: 1.4rem;
            color: var(--neon);
            font-family: var(--font-heading);
            margin-bottom: 16px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .leaderboard-table th,
        .leaderboard-table td {
            padding: 14px 24px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .leaderboard-table th {
            background: var(--dark-card-hover);
            color: var(--neon);
            font-family: var(--font-heading);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        .leaderboard-table td {
            color: var(--white);
            font-size: 0.95rem;
        }
        .leaderboard-table tr:last-child td {
            border-bottom: none;
        }
        .leaderboard-table tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }
        .leaderboard-rank {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--neon-2);
            font-weight: 700;
            width: 50px;
            text-align: center;
        }
        .leaderboard-rank.gold { color: #ffd700; }
        .leaderboard-rank.silver { color: #c0c0c0; }
        .leaderboard-rank.bronze { color: #cd7f32; }
        .player-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .player-head {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            image-rendering: pixelated;
            flex-shrink: 0;
        }
        .leaderboard-name {
            font-weight: 600;
            color: var(--white);
        }
        .leaderboard-value {
            font-weight: 700;
            color: var(--cyan);
            text-align: right;
        }
        .leaderboard-table td:last-child,
        .leaderboard-table th:last-child {
            text-align: right;
        }
        .leaderboard-update-btn {
            display: block;
            margin: 20px auto 0;
            padding: 12px 32px;
            background: linear-gradient(135deg, var(--neon), var(--mint));
            color: #170b2b;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font-heading);
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition);
        }
        .leaderboard-update-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(194, 139, 255, 0.3);
        }
        .leaderboard-loading {
            text-align: center;
            padding: 40px;
            color: var(--gray);
        }
        .leaderboard-error {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border-radius: var(--radius);
            margin: 20px 0;
        }
        .refresh-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--cyan);
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="navbar-inner">
            <div class="navbar-left">
                <a href="index.html" class="navbar-brand">
                    <img src="assets/logo-moon.webp" alt="MoonMC" class="brand-logo">
                </a>
                <div class="navbar-menu">
                    <a href="index.html">Inicio</a>
                    <a href="sobre.html">Sobre</a>
                    <a href="testador.html" class="active">Leaderboard</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="leaderboard">
        <div class="leaderboard-header">
            <h1 class="leaderboard-title">Top Jogadores</h1>
            <p class="leaderboard-subtitle" id="status">Atualizado em tempo real</p>
        </div>

        <div id="leaderboard-content">
            <div class="leaderboard-loading">
                <span class="refresh-indicator"></span>
                Carregando dados...
            </div>
        </div>

        <button class="leaderboard-update-btn" onclick="updateLeaderboard()">Atualizar Dados</button>
    </div>

    <script>
        var API_BASE = 'https://www.moonmc.com.br';

        var BOARDS = {
            'statistic_player_kills': { label: 'Kills', icon: '\u2694\uFE0F' },
            'statistic_deaths': { label: 'Mortes', icon: '\uD83D\uDC80' },
            'vault_eco_balance': { label: 'Dinheiro', icon: '\uD83D\uDCB0' },
            'ypesca_fished': { label: 'Peixes Pescados', icon: '\uD83C\uDFA3' }
        };

        var lastUpdate = null;

        function parseValue(val) {
            if (val === '---' || val === null || val === undefined) return 0;
            var cleaned = String(val).replace(/,/g, '').replace(/\s/g, '');
            var num = parseFloat(cleaned);
            return isNaN(num) ? 0 : num;
        }

        function formatMoney(val) {
            var n = parseValue(val);
            if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
            return Math.round(n).toLocaleString('pt-BR');
        }

        function formatNumber(val) {
            var n = parseValue(val);
            return Math.round(n).toLocaleString('pt-BR');
        }

        function formatTime(val) {
            if (!val || val === '---') return '0';
            return String(val);
        }

        function getHeadUrl(name) {
            return 'https://mc-heads.net/avatar/' + encodeURIComponent(name) + '/36';
        }

        function fetchLeaderboard() {
            return fetch(API_BASE + '/api/tops/read')
                .then(function(r) {
                    if (!r.ok) throw new Error('Falha');
                    return r.json();
                })
                .catch(function(e) {
                    console.error('Erro:', e);
                    return null;
                });
        }

        function updateLeaderboard() {
            var btn = document.querySelector('.leaderboard-update-btn');
            btn.textContent = 'Atualizando...';
            btn.disabled = true;
            fetchLeaderboard()
                .then(function(data) {
                    if (data && data.boards) {
                        renderLeaderboard(data);
                        lastUpdate = Date.now();
                        showToast('Dados atualizados!');
                    }
                })
                .catch(function() {
                    showToast('Erro ao atualizar');
                })
                .then(function() {
                    btn.textContent = 'Atualizar Dados';
                    btn.disabled = false;
                });
        }

        function renderBoard(boardData, boardKey) {
            var info = BOARDS[boardKey];
            if (!info || !boardData.entries || boardData.entries.length === 0) return null;

            var isMoney = boardKey === 'vault_eco_balance';
            var isTime = boardKey === 'statistic_time_played';

            var section = document.createElement('div');
            section.className = 'board-section';

            var title = document.createElement('h2');
            title.className = 'board-title';
            title.textContent = info.icon + ' ' + info.label;
            section.appendChild(title);

            var table = document.createElement('table');
            table.className = 'leaderboard-table';

            var thead = document.createElement('thead');
            var trH = document.createElement('tr');
            ['#', 'Jogador', info.label].forEach(function(t) {
                var th = document.createElement('th');
                th.textContent = t;
                trH.appendChild(th);
            });
            thead.appendChild(trH);
            table.appendChild(thead);

            var tbody = document.createElement('tbody');
            var shown = 0;

            for (var i = 0; i < boardData.entries.length && shown < 10; i++) {
                var entry = boardData.entries[i];
                if (!entry.name || entry.name === '---' || entry.value === '---') continue;

                var tr = document.createElement('tr');

                var rankTd = document.createElement('td');
                rankTd.className = 'leaderboard-rank';
                if (shown === 0) rankTd.classList.add('gold');
                else if (shown === 1) rankTd.classList.add('silver');
                else if (shown === 2) rankTd.classList.add('bronze');
                rankTd.textContent = (shown + 1).toString();
                tr.appendChild(rankTd);

                var nameTd = document.createElement('td');
                var playerDiv = document.createElement('div');
                playerDiv.className = 'player-cell';
                var headImg = document.createElement('img');
                headImg.className = 'player-head';
                headImg.src = getHeadUrl(entry.name);
                headImg.alt = entry.name;
                headImg.onerror = function() { this.style.display = 'none'; };
                playerDiv.appendChild(headImg);
                var nameSpan = document.createElement('span');
                nameSpan.className = 'leaderboard-name';
                nameSpan.textContent = entry.name;
                playerDiv.appendChild(nameSpan);
                nameTd.appendChild(playerDiv);
                tr.appendChild(nameTd);

                var valTd = document.createElement('td');
                valTd.className = 'leaderboard-value';
                if (isMoney) valTd.textContent = formatMoney(entry.value);
                else if (isTime) valTd.textContent = formatTime(entry.value);
                else valTd.textContent = formatNumber(entry.value);
                tr.appendChild(valTd);

                tbody.appendChild(tr);
                shown++;
            }

            table.appendChild(tbody);
            section.appendChild(table);
            return section;
        }

        function renderLeaderboard(data) {
            var container = document.getElementById('leaderboard-content');
            container.innerHTML = '';

            if (!data || !data.boards) {
                container.innerHTML = '<div class="leaderboard-error">Sem dados disponiveis</div>';
                return;
            }

            var hasContent = false;
            var keys = Object.keys(BOARDS);

            for (var k = 0; k < keys.length; k++) {
                var boardKey = keys[k];
                var boardData = null;
                for (var j = 0; j < data.boards.length; j++) {
                    if (data.boards[j].board === boardKey) {
                        boardData = data.boards[j];
                        break;
                    }
                }
                if (boardData) {
                    var section = renderBoard(boardData, boardKey);
                    if (section) {
                        container.appendChild(section);
                        hasContent = true;
                    }
                }
            }

            if (!hasContent) {
                container.innerHTML = '<div class="leaderboard-error">Sem dados disponiveis</div>';
            }
        }

        function showToast(msg) {
            var toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--neon);color:#170b2b;padding:12px 24px;border-radius:8px;font-weight:700;z-index:9999;transition:opacity 0.5s';
            document.body.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                setTimeout(function() { toast.remove(); }, 500);
            }, 2000);
        }

        function updateStatus() {
            var el = document.getElementById('status');
            if (!el || !lastUpdate) return;
            var s = Math.floor((Date.now() - lastUpdate) / 1000);
            el.textContent = 'Atualizado ha ' + s + 's \u00B7 Atualiza a cada 30s';
        }

        fetchLeaderboard().then(function(data) {
            if (data && data.boards) {
                renderLeaderboard(data);
                lastUpdate = Date.now();
            } else {
                document.getElementById('leaderboard-content').innerHTML = '<div class="leaderboard-error">Sem dados disponiveis</div>';
            }
            setInterval(function() {
                fetchLeaderboard().then(function(d) {
                    if (d && d.boards) {
                        renderLeaderboard(d);
                        lastUpdate = Date.now();
                    }
                });
            }, 30000);
            setInterval(updateStatus, 1000);
        });
    </script>
</body>
</html>
