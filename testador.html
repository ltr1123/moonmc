<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | MoonMC</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        .leaderboard {
            max-width: 1200px;
            margin: 120px auto 60px;
            padding: 0 24px;
        }

        .leaderboard-header {
            text-align: center;
            margin-bottom: 16px;
        }
        .leaderboard-logo {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            background: linear-gradient(135deg, #b48bfa, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: var(--font-display), sans-serif;
            text-transform: uppercase;
        }
        .leaderboard-sub {
            color: var(--gray, #888);
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-family: var(--font-heading), sans-serif;
            margin-top: 4px;
        }
        .leaderboard-line {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #b48bfa, #6ee7b7);
            border-radius: 2px;
            margin: 16px auto 0;
        }

        /* Selector */
        .period-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 24px 0 32px;
        }
        .period-btn {
            padding: 8px 24px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            background: transparent;
            color: var(--gray, #888);
            font-family: var(--font-heading), sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }
        .period-btn:hover { color: #fff; border-color: rgba(255,255,255,0.2); }
        .period-btn.active {
            background: linear-gradient(135deg, #b48bfa, #818cf8);
            color: #fff;
            border-color: transparent;
        }

        /* Grid de boards */
        .boards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        /* Card */
        .board-card {
            background: linear-gradient(180deg, rgba(100,60,180,0.12) 0%, rgba(30,20,60,0.6) 100%);
            border: 1px solid rgba(140,100,220,0.2);
            border-radius: 12px;
            overflow: hidden;
        }
        .board-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(140,100,220,0.15);
        }
        .board-card-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--neon, #b48bfa);
            font-family: var(--font-heading), sans-serif;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .board-card-badge {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--gray, #888);
            background: rgba(255,255,255,0.06);
            padding: 3px 10px;
            border-radius: 4px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        /* Lista */
        .board-list {
            list-style: none;
            padding: 4px 0;
        }
        .board-item {
            display: flex;
            align-items: center;
            padding: 8px 18px;
            gap: 12px;
            transition: background 0.15s;
        }
        .board-item:hover {
            background: rgba(255,255,255,0.03);
        }

        /* Rank */
        .rank {
            width: 28px;
            text-align: center;
            flex-shrink: 0;
        }
        .rank-num {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--gray, #888);
        }

        /* Head */
        .head {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            image-rendering: pixelated;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Nome */
        .pname {
            flex: 1;
            font-weight: 600;
            font-size: 0.88rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Valor */
        .pval {
            font-weight: 700;
            font-size: 0.88rem;
            color: #fff;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        /* Botao */
        .leaderboard-update-btn {
            display: block;
            margin: 0 auto;
            padding: 10px 28px;
            background: linear-gradient(135deg, #b48bfa, #6ee7b7);
            color: #170b2b;
            border: none;
            border-radius: 8px;
            font-family: var(--font-heading), sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }
        .leaderboard-update-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(180,139,250,0.3);
        }

        .empty-msg {
            text-align: center;
            padding: 24px;
            color: var(--gray, #888);
        }

        @media (max-width: 900px) {
            .boards-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .boards-grid { grid-template-columns: 1fr; }
            .leaderboard-logo { font-size: 2rem; }
            .leaderboard { margin-top: 100px; }
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="navbar-inner">
            <div class="navbar-left">
                <a href="index.html" class="navbar-brand">
                    <img src="assets/logo-moon.webp" alt="MoonMC" class="brand-logo">
                </a>
                <div class="navbar-menu">
                    <a href="index.html">Inicio</a>
                    <a href="sobre.html">Sobre</a>
                    <a href="testador.html" class="active">Leaderboard</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="leaderboard">
        <div class="leaderboard-header">
            <div class="leaderboard-logo">MoonMC</div>
            <div class="leaderboard-sub">Tops do Servidor</div>
            <div class="leaderboard-line"></div>
        </div>

        <div class="period-selector">
            <button class="period-btn active" data-period="alltime">All time</button>
        </div>

        <div id="boards-grid" class="boards-grid">
            <div class="empty-msg">Carregando dados...</div>
        </div>

        <button class="leaderboard-update-btn" onclick="updateLeaderboard()">Atualizar Dados</button>
    </div>

    <script>
        var API_BASE = 'https://www.moonmc.com.br';

        var BOARDS = {
            'statistic_player_kills': { label: 'Player Kills', icon: '\u2694\uFE0F' },
            'statistic_deaths': { label: 'Deaths', icon: '\uD83D\uDC80' },
            'vault_eco_balance': { label: 'Dinheiro', icon: '\uD83D\uDCB0' },
            'ypesca_fished': { label: 'Peixes', icon: '\uD83C\uDFA3' }
        };

        var BOARD_KEYS = Object.keys(BOARDS);
        var lastUpdate = null;
        var cachedData = null;

        var MEDAL_COLORS = { 0: '#ffd700', 1: '#c0c0c0', 2: '#cd7f32' };

        function parseValue(val) {
            if (val === '---' || val === null || val === undefined) return 0;
            var cleaned = String(val).replace(/,/g, '').replace(/\s/g, '');
            var num = parseFloat(cleaned);
            return isNaN(num) ? 0 : num;
        }

        function formatMoney(val) {
            var n = parseValue(val);
            if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
            return Math.round(n).toLocaleString('pt-BR');
        }

        function formatNumber(val) {
            var n = parseValue(val);
            return Math.round(n).toLocaleString('pt-BR');
        }

        function formatTime(val) {
            if (!val || val === '---') return '0';
            return String(val);
        }

        function getHeadUrl(name) {
            return 'https://mc-heads.net/avatar/' + encodeURIComponent(name) + '/36';
        }

        function medalSVG(rank) {
            var color = MEDAL_COLORS[rank] || '#555';
            return '<svg viewBox="0 0 26 30" fill="none"><path d="M13 0L16.5 4L21 2L20 7L25 9L22 13L26 17H20L18 22L13 18L8 22L6 17H0L4 13L1 7L0 2L5 4L13 0Z" fill="' + color + '" opacity="0.9"/><text x="13" y="16" text-anchor="middle" fill="#170b2b" font-size="9" font-weight="800" font-family="sans-serif">' + (rank + 1) + '</text></svg>';
        }

        function fetchLeaderboard() {
            return fetch(API_BASE + '/api/tops/read')
                .then(function(r) { if (!r.ok) throw new Error('Falha'); return r.json(); })
                .catch(function(e) { console.error('Erro:', e); return null; });
        }

        function updateLeaderboard() {
            var btn = document.querySelector('.leaderboard-update-btn');
            btn.textContent = 'Atualizando...';
            btn.disabled = true;
            fetchLeaderboard().then(function(data) {
                if (data && data.boards) { cachedData = data; renderLeaderboard(data); lastUpdate = Date.now(); showToast('Dados atualizados!'); }
            }).catch(function() { showToast('Erro ao atualizar'); })
            .then(function() { btn.textContent = 'Atualizar Dados'; btn.disabled = false; });
        }

        function renderBoard(boardData, boardKey) {
            var info = BOARDS[boardKey];
            if (!info || !boardData.entries || boardData.entries.length === 0) return null;

            var isMoney = boardKey === 'vault_eco_balance';
            var isTime = boardKey === 'statistic_time_played';

            var card = document.createElement('div');
            card.className = 'board-card';

            var header = document.createElement('div');
            header.className = 'board-card-header';
            var titleEl = document.createElement('span');
            titleEl.className = 'board-card-title';
            titleEl.textContent = info.icon + ' ' + info.label;
            header.appendChild(titleEl);
            var badge = document.createElement('span');
            badge.className = 'board-card-badge';
            badge.textContent = 'alltime';
            header.appendChild(badge);
            card.appendChild(header);

            var list = document.createElement('ul');
            list.className = 'board-list';
            var shown = 0;

            for (var i = 0; i < boardData.entries.length && shown < 10; i++) {
                var entry = boardData.entries[i];
                if (!entry.name || entry.name === '---' || entry.value === '---') continue;

                var li = document.createElement('li');
                li.className = 'board-item';

                var rankDiv = document.createElement('div');
                rankDiv.className = 'rank';
                if (shown < 3) {
                    rankDiv.innerHTML = medalSVG(shown);
                } else {
                    var numSpan = document.createElement('span');
                    numSpan.className = 'rank-num';
                    numSpan.textContent = (shown + 1);
                    rankDiv.appendChild(numSpan);
                }
                li.appendChild(rankDiv);

                var headImg = document.createElement('img');
                headImg.className = 'head';
                headImg.src = getHeadUrl(entry.name);
                headImg.alt = entry.name;
                headImg.onerror = function() { this.src = 'https://mc-heads.net/avatar/steve/36'; };
                li.appendChild(headImg);

                var nameEl = document.createElement('span');
                nameEl.className = 'pname';
                nameEl.textContent = entry.name;
                li.appendChild(nameEl);

                var valEl = document.createElement('span');
                valEl.className = 'pval';
                if (isMoney) valEl.textContent = formatMoney(entry.value);
                else if (isTime) valEl.textContent = formatTime(entry.value);
                else valEl.textContent = formatNumber(entry.value);
                li.appendChild(valEl);

                list.appendChild(li);
                shown++;
            }

            if (shown === 0) {
                var empty = document.createElement('li');
                empty.className = 'board-item';
                empty.innerHTML = '<span style="color:var(--gray,#888);width:100%;text-align:center;padding:16px 0">Sem dados</span>';
                list.appendChild(empty);
            }

            card.appendChild(list);
            return card;
        }

        function renderLeaderboard(data) {
            var grid = document.getElementById('boards-grid');
            grid.innerHTML = '';

            if (!data || !data.boards) {
                grid.innerHTML = '<div class="empty-msg" style="grid-column:1/-1">Sem dados disponiveis</div>';
                return;
            }

            var hasContent = false;

            for (var k = 0; k < BOARD_KEYS.length; k++) {
                var boardKey = BOARD_KEYS[k];
                var boardData = null;
                for (var j = 0; j < data.boards.length; j++) {
                    if (data.boards[j].board === boardKey) { boardData = data.boards[j]; break; }
                }
                if (boardData) {
                    var card = renderBoard(boardData, boardKey);
                    if (card) { grid.appendChild(card); hasContent = true; }
                }
            }

            if (!hasContent) {
                grid.innerHTML = '<div class="empty-msg" style="grid-column:1/-1">Sem dados disponiveis</div>';
            }
        }

        function showToast(msg) {
            var toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#b48bfa,#6ee7b7);color:#170b2b;padding:12px 24px;border-radius:8px;font-weight:700;z-index:9999;transition:opacity 0.5s;font-family:sans-serif';
            document.body.appendChild(toast);
            setTimeout(function() { toast.style.opacity = '0'; setTimeout(function() { toast.remove(); }, 500); }, 2000);
        }

        fetchLeaderboard().then(function(data) {
            if (data && data.boards) { cachedData = data; renderLeaderboard(data); lastUpdate = Date.now(); }
            else { document.getElementById('boards-grid').innerHTML = '<div class="empty-msg" style="grid-column:1/-1">Sem dados disponiveis</div>'; }
            setInterval(function() {
                fetchLeaderboard().then(function(d) {
                    if (d && d.boards) { cachedData = d; renderLeaderboard(d); lastUpdate = Date.now(); }
                });
            }, 30000);
        });
    </script>
</body>
</html>
