<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | MoonMC</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .leaderboard {
            max-width: 900px;
            margin: 80px auto;
            padding: 0 24px;
        }
        .leaderboard-header {
            text-align: center;
            margin-bottom: 36px;
        }
        .leaderboard-title {
            font-size: 2.2rem;
            margin-bottom: 8px;
            color: #fff;
            font-family: var(--font-display);
            letter-spacing: 0.04em;
        }
        .leaderboard-subtitle {
            color: var(--gray);
            font-size: 0.95rem;
        }

        /* Seletor de categorias */
        .category-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .cat-btn {
            padding: 10px 28px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(255,255,255,0.04);
            color: var(--gray);
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-btn:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        .cat-btn.active {
            background: linear-gradient(135deg, #b48bfa, #6ee7b7);
            color: #170b2b;
            border-color: transparent;
            font-weight: 700;
        }
        .sub-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .sub-btn {
            padding: 8px 20px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: rgba(255,255,255,0.03);
            color: var(--gray-muted, #888);
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sub-btn:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
        }
        .sub-btn.active {
            background: var(--neon, #b48bfa);
            color: #170b2b;
            border-color: transparent;
            font-weight: 700;
        }

        /* Boards */
        .board-section {
            margin-bottom: 36px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        .board-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 24px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid var(--border);
        }
        .board-icon {
            font-size: 1.3rem;
        }
        .board-title {
            font-size: 1.1rem;
            color: var(--neon);
            font-family: var(--font-heading);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin: 0;
        }

        .lb-table {
            width: 100%;
            border-collapse: collapse;
        }
        .lb-table th,
        .lb-table td {
            padding: 12px 20px;
            text-align: left;
        }
        .lb-table th {
            color: var(--gray-muted, #888);
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            background: transparent;
        }
        .lb-table td {
            color: var(--white);
            font-size: 0.92rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .lb-table tr:last-child td {
            border-bottom: none;
        }
        .lb-table tr:hover {
            background: rgba(255,255,255,0.03);
        }
        .lb-table th:last-child,
        .lb-table td:last-child {
            text-align: right;
        }
        .lb-table th:first-child {
            width: 50px;
            text-align: center;
        }
        .lb-table td:first-child {
            text-align: center;
        }

        .rank-num {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 700;
            color: var(--gray);
        }
        .rank-num.gold { color: #ffd700; }
        .rank-num.silver { color: #c0c0c0; }
        .rank-num.bronze { color: #cd7f32; }

        .player-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .player-head {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            image-rendering: pixelated;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .player-name {
            font-weight: 600;
            color: #fff;
        }
        .val-text {
            font-weight: 700;
            color: var(--cyan, #6ee7b7);
            font-variant-numeric: tabular-nums;
        }

        .empty-msg {
            text-align: center;
            padding: 24px;
            color: var(--gray);
            font-size: 0.9rem;
        }

        /* Botao atualizar */
        .leaderboard-update-btn {
            display: block;
            margin: 20px auto 0;
            padding: 12px 32px;
            background: linear-gradient(135deg, var(--neon), var(--mint));
            color: #170b2b;
            border: none;
            border-radius: 8px;
            font-family: var(--font-heading);
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition);
        }
        .leaderboard-update-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(194, 139, 255, 0.3);
        }
        .leaderboard-error {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 12px;
            margin: 20px 0;
        }

        @media (max-width: 600px) {
            .leaderboard { padding: 0 12px; }
            .board-header { padding: 12px 16px; }
            .lb-table th, .lb-table td { padding: 10px 12px; }
            .leaderboard-title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="navbar-inner">
            <div class="navbar-left">
                <a href="index.html" class="navbar-brand">
                    <img src="assets/logo-moon.webp" alt="MoonMC" class="brand-logo">
                </a>
                <div class="navbar-menu">
                    <a href="index.html">Inicio</a>
                    <a href="sobre.html">Sobre</a>
                    <a href="testador.html" class="active">Leaderboard</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="leaderboard">
        <div class="leaderboard-header">
            <h1 class="leaderboard-title">Ranqueamento</h1>
            <p class="leaderboard-subtitle" id="status">Atualizado em tempo real</p>
        </div>

        <div class="category-selector">
            <button class="cat-btn active" data-period="alltime">All time</button>
        </div>

        <div class="sub-selector" id="sub-selector"></div>

        <div id="leaderboard-content">
            <div class="empty-msg">Carregando dados...</div>
        </div>

        <button class="leaderboard-update-btn" onclick="updateLeaderboard()">Atualizar Dados</button>
    </div>

    <script>
        var API_BASE = 'https://www.moonmc.com.br';

        var BOARDS = {
            'statistic_player_kills': { label: 'Kills', icon: '\u2694\uFE0F' },
            'statistic_deaths': { label: 'Mortes', icon: '\uD83D\uDC80' },
            'vault_eco_balance': { label: 'Dinheiro', icon: '\uD83D\uDCB0' },
            'ypesca_fished': { label: 'Peixes Pescados', icon: '\uD83C\uDFA3' }
        };

        var ALL_BOARD_KEYS = Object.keys(BOARDS);
        var lastUpdate = null;
        var cachedData = null;
        var activeBoard = 'all';

        function parseValue(val) {
            if (val === '---' || val === null || val === undefined) return 0;
            var cleaned = String(val).replace(/,/g, '').replace(/\s/g, '');
            var num = parseFloat(cleaned);
            return isNaN(num) ? 0 : num;
        }

        function formatMoney(val) {
            var n = parseValue(val);
            if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
            return Math.round(n).toLocaleString('pt-BR');
        }

        function formatNumber(val) {
            var n = parseValue(val);
            return Math.round(n).toLocaleString('pt-BR');
        }

        function formatTime(val) {
            if (!val || val === '---') return '0';
            return String(val);
        }

        function getHeadUrl(name) {
            return 'https://mc-heads.net/avatar/' + encodeURIComponent(name) + '/36';
        }

        function renderSubSelector() {
            var container = document.getElementById('sub-selector');
            container.innerHTML = '';

            var allBtn = document.createElement('button');
            allBtn.className = 'sub-btn' + (activeBoard === 'all' ? ' active' : '');
            allBtn.textContent = 'Geral';
            allBtn.onclick = function() { activeBoard = 'all'; renderSubSelector(); renderFromCache(); };
            container.appendChild(allBtn);

            ALL_BOARD_KEYS.forEach(function(key) {
                var info = BOARDS[key];
                var btn = document.createElement('button');
                btn.className = 'sub-btn' + (activeBoard === key ? ' active' : '');
                btn.textContent = info.label;
                btn.onclick = function() { activeBoard = key; renderSubSelector(); renderFromCache(); };
                container.appendChild(btn);
            });
        }

        function renderFromCache() {
            if (cachedData) renderLeaderboard(cachedData);
        }

        function fetchLeaderboard() {
            return fetch(API_BASE + '/api/tops/read')
                .then(function(r) {
                    if (!r.ok) throw new Error('Falha');
                    return r.json();
                })
                .catch(function(e) {
                    console.error('Erro:', e);
                    return null;
                });
        }

        function updateLeaderboard() {
            var btn = document.querySelector('.leaderboard-update-btn');
            btn.textContent = 'Atualizando...';
            btn.disabled = true;
            fetchLeaderboard()
                .then(function(data) {
                    if (data && data.boards) {
                        cachedData = data;
                        renderLeaderboard(data);
                        lastUpdate = Date.now();
                        showToast('Dados atualizados!');
                    }
                })
                .catch(function() { showToast('Erro ao atualizar'); })
                .then(function() {
                    btn.textContent = 'Atualizar Dados';
                    btn.disabled = false;
                });
        }

        function renderBoard(boardData, boardKey) {
            var info = BOARDS[boardKey];
            if (!info || !boardData.entries || boardData.entries.length === 0) return null;

            var isMoney = boardKey === 'vault_eco_balance';
            var isTime = boardKey === 'statistic_time_played';

            var section = document.createElement('div');
            section.className = 'board-section';

            var header = document.createElement('div');
            header.className = 'board-header';
            var icon = document.createElement('span');
            icon.className = 'board-icon';
            icon.textContent = info.icon;
            header.appendChild(icon);
            var title = document.createElement('h2');
            title.className = 'board-title';
            title.textContent = info.label;
            header.appendChild(title);
            section.appendChild(header);

            var table = document.createElement('table');
            table.className = 'lb-table';

            var thead = document.createElement('thead');
            var trH = document.createElement('tr');
            ['#', 'Jogador', info.label].forEach(function(t) {
                var th = document.createElement('th');
                th.textContent = t;
                trH.appendChild(th);
            });
            thead.appendChild(trH);
            table.appendChild(thead);

            var tbody = document.createElement('tbody');
            var shown = 0;

            for (var i = 0; i < boardData.entries.length && shown < 10; i++) {
                var entry = boardData.entries[i];
                if (!entry.name || entry.name === '---' || entry.value === '---') continue;

                var tr = document.createElement('tr');

                var rankTd = document.createElement('td');
                var rankSpan = document.createElement('span');
                rankSpan.className = 'rank-num';
                if (shown === 0) rankSpan.classList.add('gold');
                else if (shown === 1) rankSpan.classList.add('silver');
                else if (shown === 2) rankSpan.classList.add('bronze');
                rankSpan.textContent = (shown + 1);
                rankTd.appendChild(rankSpan);
                tr.appendChild(rankTd);

                var nameTd = document.createElement('td');
                var playerDiv = document.createElement('div');
                playerDiv.className = 'player-cell';
                var headImg = document.createElement('img');
                headImg.className = 'player-head';
                headImg.src = getHeadUrl(entry.name);
                headImg.alt = entry.name;
                headImg.onerror = function() { this.style.display = 'none'; };
                playerDiv.appendChild(headImg);
                var nameSpan = document.createElement('span');
                nameSpan.className = 'player-name';
                nameSpan.textContent = entry.name;
                playerDiv.appendChild(nameSpan);
                nameTd.appendChild(playerDiv);
                tr.appendChild(nameTd);

                var valTd = document.createElement('td');
                var valSpan = document.createElement('span');
                valSpan.className = 'val-text';
                if (isMoney) valSpan.textContent = formatMoney(entry.value);
                else if (isTime) valSpan.textContent = formatTime(entry.value);
                else valSpan.textContent = formatNumber(entry.value);
                valTd.appendChild(valSpan);
                tr.appendChild(valTd);

                tbody.appendChild(tr);
                shown++;
            }

            table.appendChild(tbody);
            section.appendChild(table);
            return section;
        }

        function renderLeaderboard(data) {
            var container = document.getElementById('leaderboard-content');
            container.innerHTML = '';

            if (!data || !data.boards) {
                container.innerHTML = '<div class="leaderboard-error">Sem dados disponiveis</div>';
                return;
            }

            var hasContent = false;
            var keysToShow = activeBoard === 'all' ? ALL_BOARD_KEYS : [activeBoard];

            for (var k = 0; k < keysToShow.length; k++) {
                var boardKey = keysToShow[k];
                var boardData = null;
                for (var j = 0; j < data.boards.length; j++) {
                    if (data.boards[j].board === boardKey) {
                        boardData = data.boards[j];
                        break;
                    }
                }
                if (boardData) {
                    var section = renderBoard(boardData, boardKey);
                    if (section) {
                        container.appendChild(section);
                        hasContent = true;
                    }
                }
            }

            if (!hasContent) {
                container.innerHTML = '<div class="leaderboard-error">Sem dados disponiveis</div>';
            }
        }

        function showToast(msg) {
            var toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--neon);color:#170b2b;padding:12px 24px;border-radius:8px;font-weight:700;z-index:9999;transition:opacity 0.5s';
            document.body.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                setTimeout(function() { toast.remove(); }, 500);
            }, 2000);
        }

        function updateStatus() {
            var el = document.getElementById('status');
            if (!el || !lastUpdate) return;
            var s = Math.floor((Date.now() - lastUpdate) / 1000);
            el.textContent = 'Atualizado ha ' + s + 's \u00B7 Atualiza a cada 30s';
        }

        renderSubSelector();
        fetchLeaderboard().then(function(data) {
            if (data && data.boards) {
                cachedData = data;
                renderLeaderboard(data);
                lastUpdate = Date.now();
            } else {
                document.getElementById('leaderboard-content').innerHTML = '<div class="leaderboard-error">Sem dados disponiveis</div>';
            }
            setInterval(function() {
                fetchLeaderboard().then(function(d) {
                    if (d && d.boards) {
                        cachedData = d;
                        renderLeaderboard(d);
                        lastUpdate = Date.now();
                    }
                });
            }, 30000);
            setInterval(updateStatus, 1000);
        });
    </script>
</body>
</html>
